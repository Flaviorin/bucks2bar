<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucks to Bar</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Add this navbar code just after the <body> tag or before your <header> -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fs-4" href="#">Bucks to Bar</a>
        </div>
    </nav>

    <header class="bg-primary text-white text-center py-2">
        <h1>Bucks to Bar</h1>
        <h2>The best platform to track your income and expenses.</h2>
        <p>Transform your bucks into bars!</p>
    </header>
    <main class="container mt-5">
              <!-- input element with id "username" -->
        <input
            type="text"
            class="form-control"
            placeholder="Enter your username"
            id="username"
        />

        <h2>Welcome to Bucks to Bar</h2>
        <p>Your journey starts here.</p>
        
            <!-- Bootstrap Tabs -->
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="data-tab" data-bs-toggle="tab" data-bs-target="#data" type="button" role="tab" aria-controls="data" aria-selected="true">Data</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="chart-tab" data-bs-toggle="tab" data-bs-target="#chart" type="button" role="tab" aria-controls="chart" aria-selected="false">Chart</button>
                </li>
            </ul>
            <div class="tab-content mt-3" id="myTabContent">
                <div class="tab-pane fade show active" id="data" role="tabpanel" aria-labelledby="data-tab">

                    <!-- Contenedor para los datos mensuales que se generarán con JS -->
                    <div class="row" id="monthly-data-container"></div>

                </div>
                <div class="tab-pane fade" id="chart" role="tabpanel" aria-labelledby="chart-tab">
                    <canvas id="myBarChart"></canvas>
                    <!-- Botón de descarga para el gráfico -->
                    <button type="button" id="download-chart-btn" class="btn btn-primary mt-3">Download Chart</button>
                </div>
            </div>
    </main>
    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2023 Bucks to Bar. All rights reserved.</p>
    </footer>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- custom JS -->
    <script src="js/script.js"></script>
</body>
</html>
